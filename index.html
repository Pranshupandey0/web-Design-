<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Google From</title>
</head>
<body>
    <h1>html 5 from</h1>
    <from action="">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name">
        <label for="email">Email:</label>
        <input type="text" email="email" id="email">
        <label for="passowrd">Passowrd:</label>
        <input type="text" passowrd="passowrd" id="passowrd">
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="male" value="male">
        <label  for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
        <label for="country">Country</label>
        <select name="country" id="country">
            <option value="india">India</option>
            <option value="usa">USA</option>"
            <option value="uk">UK</option>
        </select><br>
        <label for="hobbies">Hobbies</label><br>
        <label for="reading">Reading</label>
        <input types="cricket" name="hobbies" id="traveling" value="traveling">
        <label for="traveling">Traveling</label>
        <input type="cricket" name="hobbies" id="sports" value="=sports">
        <label for="sports">Sports</label>
        <input type="submit" value="Submit">
    </label>
    </from>
    <script type="module" src="index.js"></script>
</body>
</html>
